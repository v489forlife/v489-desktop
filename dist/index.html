<!doctype html><html><head><meta charset="utf-8"><title>V489</title>
<style>
html,body{margin:0;height:100%;background:#050507;color:#d8d8e4;font:14px system-ui,Segoe UI,sans-serif;overflow:hidden}
.c{position:fixed;inset:0;display:grid;place-items:center}
.bg{position:fixed;inset:-20%;background:radial-gradient(circle at 50% 46%,rgba(255,46,77,.18),transparent 38%),radial-gradient(circle at 30% 80%,rgba(200,140,255,.07),transparent 40%);animation:br 4s ease-in-out infinite}
@keyframes br{50%{opacity:.55;transform:scale(1.04)}}
.eye{position:relative;width:132px;height:132px;margin:0 auto}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,46,77,.5);border-top-color:transparent;border-left-color:transparent;animation:sp 2.4s linear infinite}
.ring.r2{inset:14px;animation-duration:1.6s;animation-direction:reverse;border-color:rgba(255,122,140,.55);border-bottom-color:transparent}
.ring.r3{inset:30px;animation-duration:3.2s;border-color:rgba(200,140,255,.35);border-right-color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.core{position:absolute;inset:50px;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#ff2e4d 30%,rgba(255,0,40,0) 70%);box-shadow:0 0 40px 10px rgba(255,46,77,.45);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(.82);box-shadow:0 0 24px 4px rgba(255,46,77,.3)}}
h1{margin:28px 0 6px;font-weight:900;letter-spacing:.42em;font-size:30px;color:#fff;text-indent:.42em;text-shadow:0 0 18px rgba(255,46,77,.6)}
.s{color:#6a6a7c;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.bf{position:fixed;width:10px;height:8px;opacity:.55;animation:fl linear infinite}
.bf:before,.bf:after{content:"";position:absolute;top:0;width:5px;height:8px;border-radius:50%;background:#c88cff;animation:fp .25s ease-in-out infinite alternate}
.bf:before{left:0;transform-origin:right}.bf:after{right:0;transform-origin:left}
@keyframes fp{to{transform:scaleX(.25)}}
@keyframes fl{from{transform:translate(0,110vh)}to{transform:translate(40px,-10vh)}}
#off{display:none;margin-top:18px;text-align:center}
button{margin-top:10px;background:#ff2e4d;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(255,46,77,.4)}
</style></head><body>
<div class="bg"></div>
<div class="c"><div><div class="eye"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div>
<h1>V489</h1><div class="s" id="st">Connecting</div>
<div id="off"><div>You're offline or v489.app isn't reachable.</div><div class="s" id="cd" style="margin-top:6px"></div><button id="rt">Retry</button></div></div></div>
<script>
for(let i=0;i<7;i++){const b=document.createElement("div");b.className="bf";b.style.left=(8+i*13)+"%";b.style.animationDuration=(9+i*2.3)+"s";b.style.animationDelay=(-i*1.7)+"s";document.body.appendChild(b)}
const URL_="https://v489.app/home";let timer;
async function go(){clearInterval(timer);document.getElementById("off").style.display="none";document.getElementById("st").textContent="Connecting";
 try{const c=new AbortController();setTimeout(()=>c.abort(),8000);await fetch("https://v489.app/api/auth/providers",{mode:"no-cors",cache:"no-store",signal:c.signal});
  document.getElementById("st").textContent="Loading studio";location.replace(URL_)}
 catch(e){document.getElementById("st").textContent="Offline";document.getElementById("off").style.display="block";let n=10;const cd=document.getElementById("cd");cd.textContent="Retrying in "+n+"s";timer=setInterval(()=>{n--;cd.textContent="Retrying in "+n+"s";if(n<=0)go()},1000)}}
document.getElementById("rt").onclick=go;window.addEventListener("online",go);setTimeout(go,700);
</script></body></html>
